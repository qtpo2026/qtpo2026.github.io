    params:
      description: |
        Quantum Technologies for Precision Oncology: From Drug Discovery to Radiation Therapy
        is an international workshop bringing together researchers, clinicians, engineers,
        technology developers, industry leaders, and decision-makers to explore the emerging
        role of quantum and quantum-inspired technologies in cancer research and care.

      themes:
        event:
          title: "Quantum Technologies for Precision Oncology"
          shortTitle: "QTPO 2026"
          slogan: "From Drug Discovery to Radiation Therapy"
          location: "Washington, DC"
          startDate: 2026-11-05
          endDate: 2026-11-06

          address:
            - "Carolina at The Capitol"
            - "101 Constitution Avenue NW"
            - "Washington, DC"

          description: |
            **Quantum Technologies for Precision Oncology: From Drug Discovery to Radiation Therapy**
            is an international workshop bringing together researchers, clinicians, engineers,
            technology developers, industry leaders, and decision-makers to explore the emerging
            role of quantum and quantum-inspired technologies in cancer research and care.

            The workshop will place particular emphasis on **radiation therapy and treatment
            planning**, where advanced computational methods have the potential to improve
            optimization, personalization, and clinical decision-making.

            Selected discussions will also address broader applications in oncology,
            including **drug discovery** and other computational challenges in cancer research.

            A central goal is to build stronger connections among the **quantum computing,
            clinical, and engineering communities** and develop a shared understanding of
            clinical needs, computational opportunities, and technological capabilities.

            With participants and invited speakers from the **United States, Japan, and Europe**,
            the workshop will provide an international forum for exchanging research results,
            clinical experience, emerging technologies, funding opportunities, and future
            research priorities. This event is scheduled and located close to
            [PTCOG NA 2026](https://www.ptcog-na.org/ptcog-na-12th-annual-meeting).

          # QTPO 2026 speakers are invited directly by the organizing
          # committee — there is no open registration. Clicking the
          # "I'm Interested in Attending" button (header, hero, sidebar,
          # speakers page, etc.) opens a popup with the guest-interest
          # form instead of navigating — see #attend-modal in
          # layouts/_default/baseof.html.
          callToAction:
            other:
              url: "#attend-modal"
            enableBanner: false

          attendFormEmbedUrl: "https://docs.google.com/forms/d/e/1FAIpQLSfceSE3eOLhalscMk0Tu0rbTUtwfxEmb1PTVaW0j2gjAkzOJw/viewform?embedded=true"

          images:
