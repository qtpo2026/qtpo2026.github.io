            # path (assets/logos/qtpo-logo.png) and it will appear automatically
            # in the header, sidebar and homepage — no config change needed.
            logo: logos/qtpo-logo.png
            titleBackground: images/homepage_background.png

          # Palette derived from the QTPO logo (navy / teal / violet). Swap for
          # exact brand hex codes once available.
          colors:
